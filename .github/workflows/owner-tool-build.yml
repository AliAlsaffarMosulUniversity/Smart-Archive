name: Build Owner Activation Tool
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/owner-tool-build.yml'
permissions:
  contents: read
jobs:
  owner-tool:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "cryptography>=43,<49" "pyinstaller>=6,<7"
      - name: Prepare generic tool without any owner key
        shell: python
        run: |
          import base64
          from pathlib import Path
          Path('issuer_gui.py').write_bytes(base64.b64decode(''))
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SmartArchive-License-Manager issuer_gui.py
      - name: Test the compiled application with a temporary test key
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\SmartArchive-License-Manager.exe -ArgumentList '--self-test','--report',"$PWD\dist\SELF_TEST.txt" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Executable self-test failed" }
          $report = Get-Content dist\SELF_TEST.txt
          if ($report -notmatch '^PASS:') { throw "Missing success report" }
      - uses: actions/upload-artifact@v4
        with:
          name: SmartArchive-Owner-Tool-No-Key
          path: dist/
